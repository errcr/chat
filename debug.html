<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debug</title>
  <style>
    body { font-family: monospace; background: #0f0e17; color: #e8e6f4; padding: 20px; font-size: 14px; }
    h2 { color: #7c6af7; margin-bottom: 16px; }
    .item { margin: 8px 0; padding: 10px; border-radius: 8px; background: #1a1826; }
    .ok  { border-left: 4px solid #34d399; }
    .err { border-left: 4px solid #f87171; }
    .warn{ border-left: 4px solid #fbbf24; }
    button { margin-top: 20px; padding: 12px 24px; background: #7c6af7; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-family: monospace; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
<h2>🔍 Secret Chat — Debug</h2>
<div id="out"></div>
<button onclick="clearSW()">🗑️ Limpar Service Worker e Cache</button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  var out = document.getElementById("out");

  function log(msg, type) {
    var d = document.createElement("div");
    d.className = "item " + (type || "ok");
    d.textContent = msg;
    out.appendChild(d);
  }

  // 1. User Agent
  log("📱 UA: " + navigator.userAgent);

  // 2. Service Worker
  if (!("serviceWorker" in navigator)) {
    log("❌ Service Worker: NÃO suportado", "err");
  } else {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      if (regs.length === 0) {
        log("⚠️ Service Worker: nenhum registrado", "warn");
      } else {
        regs.forEach(function(reg) {
          var state = reg.active ? reg.active.scriptURL : "sem active";
          log("✅ SW registrado: " + state);
          log("   → installing: " + (reg.installing ? reg.installing.state : "null"));
          log("   → waiting: "    + (reg.waiting    ? reg.waiting.state    : "null"));
          log("   → active: "     + (reg.active     ? reg.active.state     : "null"));
        });
      }
      var ctrl = navigator.serviceWorker.controller;
      log(ctrl ? "✅ Controller ativo: " + ctrl.scriptURL : "⚠️ Sem controller (página não controlada)", ctrl ? "ok" : "warn");
    });
  }

  // 3. Cache Storage
  if (!window.caches) {
    log("❌ Cache Storage: NÃO suportado", "err");
  } else {
    caches.keys().then(function(keys) {
      if (keys.length === 0) {
        log("⚠️ Cache Storage: vazio", "warn");
      } else {
        keys.forEach(function(k) { log("📦 Cache: " + k); });
      }
    });
  }

  // 4. Firebase Auth
  firebase.initializeApp({
    apiKey: "AIzaSyA0D_A9gFG5t7b0DnSDnpRZm5aAXvBZ7xc",
    authDomain: "chat-d61cc.firebaseapp.com",
    databaseURL: "https://chat-d61cc-default-rtdb.firebaseio.com",
    projectId: "chat-d61cc",
    storageBucket: "chat-d61cc.firebasestorage.app",
    messagingSenderId: "726411546652",
    appId: "1:726411546652:web:c085842f36691dc0c4cfd9"
  });

  var auth = firebase.auth();
  var db   = firebase.database();

  auth.onAuthStateChanged(function(user) {
    if (!user) {
      log("⚠️ Firebase Auth: nenhum usuário logado", "warn");
      return;
    }
    log("✅ Firebase Auth: logado como " + user.email + " (uid: " + user.uid + ")");

    // 5. Teste de LEITURA
    db.ref("messages").limitToLast(1).once("value")
      .then(function(snap) {
        log("✅ Firebase READ: OK (existe: " + snap.exists() + ")");
      })
      .catch(function(e) {
        log("❌ Firebase READ erro: " + e.message + " [code: " + e.code + "]", "err");
      });

    // 6. Teste de ESCRITA — escreve em flood_control (permitido para o próprio uid)
    db.ref("flood_control/" + user.uid).set({ lastMsg: Date.now(), name: user.displayName || "test" })
      .then(function() {
        log("✅ Firebase WRITE flood_control: OK");
      })
      .catch(function(e) {
        log("❌ Firebase WRITE flood_control erro: " + e.message + " [code: " + e.code + "]", "err");
      });

    // 7. Teste de ESCRITA — tenta escrever mensagem de teste
    var testRoom = "debug-test-room";
    var testRef  = db.ref("messages/" + testRoom).push();
    testRef.set({
      name: user.displayName || "test",
      userId: user.uid,
      ts: Date.now(),
      text: "debug-test"
    })
    .then(function() {
      log("✅ Firebase WRITE messages: OK");
      testRef.remove(); // limpa após teste
    })
    .catch(function(e) {
      log("❌ Firebase WRITE messages erro: " + e.message + " [code: " + e.code + "]", "err");
    });
  });

  // Botão: limpa SW e cache
  function clearSW() {
    var promises = [];

    if ("serviceWorker" in navigator) {
      promises.push(
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r) { return r.unregister(); }));
        })
      );
    }

    if (window.caches) {
      promises.push(
        caches.keys().then(function(keys) {
          return Promise.all(keys.map(function(k) { return caches.delete(k); }));
        })
      );
    }

    Promise.all(promises).then(function() {
      alert("✅ Service Worker e cache limpos! A página vai recarregar.");
      window.location.reload();
    }).catch(function(e) {
      alert("Erro ao limpar: " + e.message);
    });
  }
</script>
</body>
</html>
